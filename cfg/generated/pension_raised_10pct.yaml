Environment:
  env_core:
    problem_scene: pension_raised_10pct
    episode_length: 300
  Entities:
  - entity_name: government
    entity_args:
      params:
        type: pension
        gov_task: social_welfare
        retire_age: 65
        contribution_rate: 0.1
  - entity_name: households
    entity_args:
      params:
        type: OLG
        households_n: 1000
        CRRA: 2.0
        IFE: 1.0
      OLG:
        birth_rate: 0.02
        initial_working_age: 20
  - entity_name: market
    entity_args:
      params:
        type: perfect
  - entity_name: bank
    entity_args:
      params:
        type: commercial
Trainer:
  house_alg: rule_based
  gov_alg: rule_based
  firm_alg: rule_based
  bank_alg: rule_based
  seed: 1
  eval_episodes: 5
  epoch_length: 300
  cuda: false
  test: true
