Environment:
  env_core:
    problem_scene: oligopoly_competition_2firms
    episode_length: 100
  Entities:
  - entity_name: government
    entity_args:
      params:
        type: tax
        gov_task: gdp
  - entity_name: households
    entity_args:
      params:
        type: ramsey
        households_n: 500
  - entity_name: market
    entity_args:
      params:
        type: oligopoly
  - entity_name: bank
    entity_args:
      params:
        type: commercial
Trainer:
  house_alg: bc
  gov_alg: rule_based
  firm_alg: ppo
  bank_alg: rule_based
  seed: 1
  eval_episodes: 5
  epoch_length: 100
  cuda: false
  test: false
  n_epochs: 300
