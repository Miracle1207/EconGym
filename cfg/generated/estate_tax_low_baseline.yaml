Environment:
  env_core:
    problem_scene: estate_tax_low_baseline
    episode_length: 300
    estate_tax_rate: 0.1
    estate_tax_exemption: 1000000.0
  Entities:
  - entity_name: government
    entity_args:
      params:
        type: tax
        gov_task: gini
  - entity_name: households
    entity_args:
      params:
        type: OLG
        households_n: 500
      OLG:
        birth_rate: 0.02
        initial_working_age: 22
  - entity_name: market
    entity_args:
      params:
        type: perfect
  - entity_name: bank
    entity_args:
      params:
        type: non_profit
Trainer:
  house_alg: rule_based
  gov_alg: rule_based
  firm_alg: rule_based
  bank_alg: rule_based
  seed: 1
  eval_episodes: 5
  epoch_length: 300
  cuda: false
  test: true
