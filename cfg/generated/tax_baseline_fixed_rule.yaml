Environment:
  env_core:
    problem_scene: tax_baseline_fixed_rule
    episode_length: 30
  Entities:
  - entity_name: government
    entity_args:
      params:
        type: tax
        gov_task: gdp_gini
  - entity_name: households
    entity_args:
      params:
        type: ramsey
        households_n: 500
  - entity_name: market
    entity_args:
      params:
        type: perfect
  - entity_name: bank
    entity_args:
      params:
        type: non_profit
Trainer:
  house_alg: bc
  gov_alg: rule_based
  firm_alg: rule_based
  bank_alg: rule_based
  seed: 1
  eval_episodes: 2
  epoch_length: 30
  cuda: false
  test: true
