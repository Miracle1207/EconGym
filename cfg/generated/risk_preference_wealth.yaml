Environment:
  env_core:
    problem_scene: risk_preference_wealth
    episode_length: 100
  Entities:
  - entity_name: government
    entity_args:
      params:
        type: tax
        gov_task: social_welfare
  - entity_name: households
    entity_args:
      params:
        type: ramsey_risk_invest
        households_n: 200
        stock_alpha: 0.15
  - entity_name: market
    entity_args:
      params:
        type: perfect
  - entity_name: bank
    entity_args:
      params:
        type: commercial
Trainer:
  house_alg: rule_based
  gov_alg: rule_based
  firm_alg: rule_based
  bank_alg: rule_based
  seed: 1
  eval_episodes: 2
  epoch_length: 100
  cuda: false
  test: true
  tax_gov_alg: rule_based
