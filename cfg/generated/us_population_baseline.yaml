Environment:
  env_core:
    problem_scene: us_population_baseline
    episode_length: 10
  Entities:
  - entity_name: government
    entity_args:
      params:
        type: pension
        retire_age: 65
        contribution_rate: 0.124
  - entity_name: households
    entity_args:
      params:
        type: OLG
        households_n: 3000
      OLG:
        birth_rate: 0.011
        initial_working_age: 20
  - entity_name: market
    entity_args:
      params:
        type: perfect
  - entity_name: bank
    entity_args:
      params:
        type: non_profit
Trainer:
  house_alg: rule_based
  gov_alg: rule_based
  firm_alg: rule_based
  bank_alg: rule_based
  seed: 1
  eval_episodes: 5
  epoch_length: 10
  cuda: false
  test: true
