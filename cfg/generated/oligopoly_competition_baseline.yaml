Environment:
  env_core:
    problem_scene: oligopoly_competition_baseline
    episode_length: 50
  Entities:
  - entity_name: government
    entity_args:
      params:
        type: tax
        gov_task: gdp
  - entity_name: households
    entity_args:
      params:
        type: ramsey
        households_n: 200
  - entity_name: market
    entity_args:
      params:
        type: oligopoly
  - entity_name: bank
    entity_args:
      params:
        type: non_profit
Trainer:
  house_alg: bc
  gov_alg: rule_based
  firm_alg: rule_based
  bank_alg: rule_based
  seed: 1
  eval_episodes: 3
  epoch_length: 50
  cuda: false
  test: true
